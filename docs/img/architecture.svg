<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="title desc">
  <title id="title">How the predictive autoscaler works</title>
  <desc id="desc">Traffic reaches your pods, which expose a request count that Prometheus scrapes. The forecaster reads the history from Prometheus and writes back forecast_rps. KEDA reads the forecast and the current request rate, the HPA takes whichever asks for more pods, and scales your pods.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0072B2"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .name { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .sub { font-size: 12px; fill: #59636e; text-anchor: middle; }
      .edge { font-size: 12.5px; fill: #3b4252; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #0072B2; }
      .box { fill: #ffffff; stroke: #3b4252; stroke-width: 1.5; }
      .line { stroke: #3b4252; stroke-width: 1.6; fill: none; }
      .blue { stroke: #0072B2; }
    </style>
  </defs>

  <!-- white card so the diagram reads the same on light and dark GitHub themes -->
  <rect x="0.5" y="0.5" width="959" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Traffic -->
  <rect class="box" x="15" y="51" width="100" height="44" rx="22"/>
  <text class="name" x="65" y="78">Traffic</text>

  <!-- Your pods (stacked) -->
  <rect class="box" x="168" y="40" width="130" height="52" rx="6"/>
  <rect class="box" x="164" y="44" width="130" height="52" rx="6"/>
  <rect class="box" x="160" y="48" width="130" height="52" rx="6"/>
  <text class="name" x="225" y="71">Your pods</text>
  <text class="sub" x="225" y="89">request counter</text>

  <!-- Prometheus (cylinder) -->
  <path class="box" d="M390,48 v52 a70,11 0 0,0 140,0 v-52"/>
  <ellipse class="box" cx="460" cy="48" rx="70" ry="11"/>
  <text class="name" x="460" y="82">Prometheus</text>
  <text class="sub" x="460" y="99">scrapes every 15 s</text>

  <!-- KEDA -->
  <rect class="box" x="640" y="48" width="115" height="52" rx="6"/>
  <text class="name" x="697.5" y="71">KEDA</text>
  <text class="sub" x="697.5" y="89">two triggers</text>

  <!-- HPA -->
  <rect class="box" x="830" y="48" width="115" height="52" rx="6"/>
  <text class="name" x="887.5" y="71">HPA</text>
  <text class="sub" x="887.5" y="89">follows the higher</text>

  <!-- Forecaster: the component this project adds -->
  <rect x="390" y="190" width="140" height="52" rx="6" fill="#e8f2f9" stroke="#0072B2" stroke-width="1.8"/>
  <text class="name" x="460" y="213">Forecaster</text>
  <text class="sub" x="460" y="231">every 30 s</text>
  <text class="sub" x="460" y="260" style="fill:#0072B2">added by this project</text>

  <!-- Traffic -> pods -->
  <line class="line" x1="115" y1="74" x2="157" y2="74" marker-end="url(#arrow)"/>

  <!-- pods -> Prometheus -->
  <line class="line" x1="298" y1="74" x2="387" y2="74" marker-end="url(#arrow)"/>
  <text class="edge" x="343" y="64" text-anchor="middle">request count</text>

  <!-- Prometheus -> forecaster (history) -->
  <line class="line" x1="440" y1="112" x2="440" y2="187" marker-end="url(#arrow)"/>
  <text class="edge" x="432" y="154" text-anchor="end">history</text>

  <!-- forecaster -> Prometheus (forecast_rps) -->
  <line class="line blue" x1="480" y1="190" x2="480" y2="115" marker-end="url(#arrow-blue)"/>
  <text class="mono" x="489" y="154">forecast_rps</text>

  <!-- Prometheus -> KEDA -->
  <line class="line" x1="530" y1="74" x2="637" y2="74" marker-end="url(#arrow)"/>
  <text class="edge" x="584" y="50" text-anchor="middle">forecast +</text>
  <text class="edge" x="584" y="65" text-anchor="middle">request rate</text>

  <!-- KEDA -> HPA -->
  <line class="line" x1="755" y1="74" x2="827" y2="74" marker-end="url(#arrow)"/>

  <!-- HPA -> pods (scales), loop along the bottom -->
  <path class="line" d="M887.5,100 V280 H225 V103" marker-end="url(#arrow)"/>
  <text class="edge" x="720" y="272" text-anchor="middle">scales</text>
</svg>
