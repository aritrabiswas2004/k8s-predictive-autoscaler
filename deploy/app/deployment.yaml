apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Only the app node, and only web may run there (the node is tainted role=app).
      nodeSelector:
        role: app
      tolerations:
        - key: role
          operator: Equal
          value: app
          effect: NoSchedule
      # Must cover the app's shutdown sequence: ~5 s drain + up to 15 s in-flight requests.
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: predictive-autoscaling-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ~10 ms of CPU per request on an M-series Mac, i.e. ~50 RPS at 0.5 CPU.
            # Calibrated properly in Phase 2.
            - name: WORK_ITERATIONS
              value: "150000"
            # Simulated warm-up (JVM start, model load, cache fill). This is what makes
            # reactive scale-up lag visible.
            - name: STARTUP_DELAY_SECONDS
              value: "30"
          # requests == limits: Guaranteed QoS, predictable per-pod capacity,
          # and cost per pod is simply 0.5 CPU + 128Mi.
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # Probes must tolerate overload. Phase 2 calibration at 70 RPS on one pod: /healthz
          # took > 1 s (the default timeout), the kubelet restarted the container, and with
          # the 30 s startup delay the Service had no endpoints. Under-provisioned arms would
          # be punished by probe restarts instead of by latency, so: readiness only drops a
          # pod after ~6 s unresponsive, liveness only restarts after ~60 s. Neither affects
          # time-to-Ready (successThreshold 1) or draining (terminating endpoints are removed
          # on deletion, not by the probe).
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
