apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Only the app node, and only web may run there (the node is tainted role=app).
      nodeSelector:
        role: app
      tolerations:
        - key: role
          operator: Equal
          value: app
          effect: NoSchedule
      # Must cover the app's shutdown sequence: ~5 s drain + up to 15 s in-flight requests.
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: predictive-autoscaling-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # ~10 ms of CPU per request on an M-series Mac, i.e. ~50 RPS at 0.5 CPU.
            # Calibrated properly in Phase 2.
            - name: WORK_ITERATIONS
              value: "150000"
            # Simulated warm-up (JVM start, model load, cache fill). This is what makes
            # reactive scale-up lag visible.
            - name: STARTUP_DELAY_SECONDS
              value: "30"
          # requests == limits: Guaranteed QoS, predictable per-pod capacity,
          # and cost per pod is simply 0.5 CPU + 128Mi.
          resources:
            requests:
              cpu: 500m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
